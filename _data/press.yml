# Press coverage, listed on /press/.
#
# To add an item, copy an existing block. Fields:
#   title  - the headline, as published
#   outlet - publication or channel name
#   date   - free text, shown as-is (e.g. "May 2022", "2024")
#   sort   - YYYY-MM-DD, used only for ordering within a group (newest first)
#   url    - link to the article
#   type   - article | video | profile  (controls the little label and icon)
#   blurb  - one or two sentences of context, in your own words

